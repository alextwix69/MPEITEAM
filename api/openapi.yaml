openapi: 3.1.0
info:
  title: Команда.МЭИ Frontend API
  version: 1.0.0
  summary: REST-контракт MVP между web frontend и backend
  description: |
    Source-of-truth для browser REST API. Общие правила authorization, retries,
    idempotency, optimistic concurrency и кодов ошибок описаны также в
    docs/architecture/api-contracts.md. Внутренние worker/provider API не входят.
  license:
    name: Proprietary
servers:
  - url: /api/v1
    description: Same-origin reverse proxy
tags:
  - { name: Identity }
  - { name: Profiles }
  - { name: Catalog }
  - { name: Search }
  - { name: Files }
  - { name: Opportunities }
  - { name: Recruitment }
  - { name: Teams }
  - { name: Scheduling }
  - { name: Messaging }
  - { name: Notifications }
  - { name: Trust }
  - { name: Moderation }
  - { name: Compliance }
security:
  - CookieSession: []
paths:
  /auth/csrf:
    get:
      tags: [Identity]
      operationId: getCsrfToken
      summary: Получить CSRF token текущей сессии
      x-authorization: Любая незавершённая session.
      responses:
        '200':
          description: CSRF token; Cache-Control no-store.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/CsrfToken' } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
  /auth/registrations:
    post:
      tags: [Identity]
      operationId: registerAccount
      summary: Зарегистрировать аккаунт
      security: []
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      x-authorization: Public; rate limit по IP и normalized email.
      x-business-errors: [EMAIL_ALREADY_REGISTERED, EMAIL_DOMAIN_NOT_ALLOWED, AGE_CONFIRMATION_REQUIRED, CONSENT_REQUIRED, CONSENT_VERSION_OUTDATED]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/RegistrationRequest' } }
      responses:
        '201':
          description: Аккаунт создан в unverified, письмо поставлено в очередь.
          content:
            application/json: { schema: { $ref: '#/components/schemas/RegistrationResult' } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
  /auth/email-verifications:
    post:
      tags: [Identity]
      operationId: verifyEmail
      summary: Подтвердить email одноразовым token
      security: []
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      x-business-errors: [TOKEN_INVALID_OR_EXPIRED, CONSENT_EVIDENCE_UNAVAILABLE]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/TokenRequest' } }
      responses:
        '200':
          description: Email подтверждён, session создана/обновлена.
          content:
            application/json: { schema: { $ref: '#/components/schemas/SessionView' } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
  /auth/email-verifications/resend:
    post:
      tags: [Identity]
      operationId: resendEmailVerification
      summary: Повторно запросить письмо подтверждения
      security: []
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      x-authorization: Public generic flow либо unverified session; результат не раскрывает наличие email.
      x-business-errors: [ALREADY_VERIFIED]
      requestBody:
        required: false
        content:
          application/json: { schema: { $ref: '#/components/schemas/EmailRequest' } }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
  /auth/sessions:
    post:
      tags: [Identity]
      operationId: createSession
      summary: Войти по email и password
      security: []
      parameters:
        - { $ref: '#/components/parameters/OptionalIdempotencyKey' }
      x-business-errors: [INVALID_CREDENTIALS, ACCOUNT_DELETED]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } }
      responses:
        '200':
          description: Session cookie установлена; ответ не кешируется.
          content:
            application/json: { schema: { $ref: '#/components/schemas/SessionView' } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
  /auth/session:
    delete:
      tags: [Identity]
      operationId: deleteCurrentSession
      summary: Завершить текущую сессию
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
      x-authorization: Current session, включая deleting account.
      x-idempotency: HTTP DELETE; повтор возвращает 204.
      responses:
        '204': { description: Session отозвана. }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
  /auth/password-resets:
    post:
      tags: [Identity]
      operationId: requestPasswordReset
      summary: Запросить восстановление доступа
      security: []
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/EmailRequest' } }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
  /auth/password-resets/confirm:
    post:
      tags: [Identity]
      operationId: confirmPasswordReset
      summary: Установить password по подтверждённому reset token
      security: []
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      x-business-errors: [TOKEN_INVALID_OR_EXPIRED, PASSWORD_REUSED]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PasswordResetConfirm' } }
      responses:
        '204': { description: 'Password изменён, прежние sessions отозваны.' }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
  /me:
    get:
      tags: [Identity]
      operationId: getCurrentAccount
      summary: Получить current account и capability flags
      x-authorization: Current session, включая unverified/deleting.
      responses:
        '200':
          description: Current account.
          content:
            application/json: { schema: { $ref: '#/components/schemas/CurrentAccount' } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
  /me/profile:
    get:
      tags: [Profiles]
      operationId: getOwnProfile
      summary: Получить свой profile, включая draft/pending state
      responses:
        '200':
          description: Own profile.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/Profile' } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
    patch:
      tags: [Profiles]
      operationId: updateOwnProfile
      summary: Создать новую moderated version своего profile
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      x-authorization: Active account; profile owner.
      x-business-errors: [CONTENT_EDIT_LOCKED, MEDIA_NOT_READY, ROLE_FIELDS_INVALID]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ProfileInput' } }
      responses:
        '202':
          description: Version сохранена и поставлена на moderation.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/Profile' } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
  /profiles/{accountId}:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
    get:
      tags: [Profiles]
      operationId: getPublicProfile
      summary: Получить approved public profile и visible resumes
      x-authorization: Active account; target profile visible. Email не выдаётся.
      responses:
        '200':
          description: Public profile.
          content:
            application/json: { schema: { $ref: '#/components/schemas/PublicProfile' } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
  /me/resumes:
    get:
      tags: [Profiles]
      operationId: listOwnResumes
      summary: Получить все свои resumes в slot order
      responses:
        '200':
          description: Не более шести resumes.
          content:
            application/json: { schema: { $ref: '#/components/schemas/ResumeList' } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
    post:
      tags: [Profiles]
      operationId: createAdditionalResume
      summary: Создать additional resume
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      x-authorization: Active account; owner.
      x-business-errors: [RESUME_LIMIT_REACHED, TAG_NOT_FOUND, MEDIA_NOT_READY]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ResumeInput' } }
      responses:
        '202':
          description: Additional resume создано и ожидает moderation.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/Resume' } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
  /me/resumes/{resumeId}:
    parameters:
      - { $ref: '#/components/parameters/ResumeId' }
    get:
      tags: [Profiles]
      operationId: getOwnResume
      summary: Получить своё resume
      responses:
        '200':
          description: Resume including owner-only state.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/Resume' } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
    patch:
      tags: [Profiles]
      operationId: updateOwnResume
      summary: Создать новую moderated resume version
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      x-business-errors: [PRIMARY_RESUME_MUST_BE_VISIBLE, CONTENT_EDIT_LOCKED, TAG_NOT_FOUND, MEDIA_NOT_READY]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ResumeInput' } }
      responses:
        '202':
          description: Resume version принята на moderation.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/Resume' } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
    delete:
      tags: [Profiles]
      operationId: deleteAdditionalResume
      summary: Удалить additional resume
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      x-business-errors: [PRIMARY_RESUME_CANNOT_BE_DELETED]
      responses:
        '204': { description: Resume удалено; application snapshots не изменены. }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
  /catalog/tags:
    get:
      tags: [Catalog]
      operationId: listTags
      summary: Получить active product tag catalog
      parameters:
        - name: category
          in: query
          schema: { type: string, maxLength: 120 }
        - { $ref: '#/components/parameters/IfNoneMatch' }
      x-pagination: Bounded catalog of exactly 180 active tags; no cursor.
      x-sorting: sortOrder ascending.
      responses:
        '200':
          description: Active tag catalog.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/TagCatalog' } }
        '304': { description: Catalog не изменился. }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
  /search/people:
    get:
      tags: [Search]
      operationId: searchPeople
      summary: Искать людей по ФИО и approved profile/resume projection
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: tagId, in: query, schema: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/Uuid' } }, explode: true }
        - { name: tagMode, in: query, schema: { type: string, enum: [any, all], default: any } }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/FormalRole' } }
        - { name: institute, in: query, schema: { type: string, maxLength: 200 } }
        - { name: department, in: query, schema: { type: string, maxLength: 200 } }
        - { name: sort, in: query, schema: { type: string, enum: [activity_desc, activity_asc], default: activity_desc } }
      x-business-errors: [TAG_NOT_FOUND]
      x-sorting: Activity value is hidden; ties use lastActionAt, accountCreatedAt and accountId.
      responses:
        '200':
          description: Search page; empty result is items [].
          content:
            application/json: { schema: { $ref: '#/components/schemas/PeopleSearchPage' } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
  /search/opportunities:
    get:
      tags: [Search]
      operationId: searchOpportunities
      summary: Искать published opportunities по title и filters
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: tagId, in: query, schema: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/Uuid' } }, explode: true }
        - { name: tagMode, in: query, schema: { type: string, enum: [any, all], default: any } }
        - { name: authorKind, in: query, schema: { $ref: '#/components/schemas/AuthorKind' } }
        - { name: authorRole, in: query, schema: { $ref: '#/components/schemas/FormalRole' } }
        - { name: institute, in: query, schema: { type: string, maxLength: 200 } }
        - { name: department, in: query, schema: { type: string, maxLength: 200 } }
        - { name: sort, in: query, schema: { type: string, enum: [popularity_desc, popularity_asc, newest], default: popularity_desc } }
      x-business-errors: [FILTER_NOT_APPLICABLE, TAG_NOT_FOUND]
      x-sorting: Popularity value is hidden; ties use publishedAt and opportunityId.
      responses:
        '200':
          description: Search page; empty result is items [].
          content:
            application/json: { schema: { $ref: '#/components/schemas/OpportunitySearchPage' } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
  /uploads:
    post:
      tags: [Files]
      operationId: createUploadSession
      summary: Создать direct upload session
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      x-business-errors: [UPLOAD_SCOPE_MISMATCH, UPLOAD_LIMIT_EXCEEDED, OWNER_NOT_FOUND]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/UploadCreate' } }
      responses:
        '201':
          description: Short-lived, object-scoped presigned PUT.
          content:
            application/json: { schema: { $ref: '#/components/schemas/UploadSession' } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
  /uploads/{uploadId}:
    parameters:
      - { $ref: '#/components/parameters/UploadId' }
    get:
      tags: [Files]
      operationId: getUploadSession
      summary: Получить состояние обработки upload
      x-authorization: Uploader only.
      responses:
        '200':
          description: Upload state.
          content:
            application/json: { schema: { $ref: '#/components/schemas/UploadSession' } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
  /uploads/{uploadId}/complete:
    parameters:
      - { $ref: '#/components/parameters/UploadId' }
    post:
      tags: [Files]
      operationId: completeUpload
      summary: Завершить direct upload и запустить sanitization
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      x-authorization: Uploader only.
      x-business-errors: [UPLOAD_NOT_FOUND, UPLOAD_EXPIRED, UPLOAD_OBJECT_MISMATCH]
      responses:
        '202':
          description: Processing начат или ранее начат.
          content:
            application/json: { schema: { $ref: '#/components/schemas/UploadSession' } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
  /media/{mediaId}/download-url:
    parameters:
      - { $ref: '#/components/parameters/MediaId' }
    get:
      tags: [Files]
      operationId: createMediaDownloadUrl
      summary: Получить short-lived signed GET после object authorization
      x-business-errors: [MEDIA_NOT_READY, MEDIA_NO_LONGER_STORED]
      responses:
        '200':
          description: URL не кешируется и действует не более пяти минут.
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/DownloadUrl' } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
  /opportunities:
    post:
      tags: [Opportunities]
      operationId: createOpportunity
      summary: Создать personal/team opportunity и отправить на moderation
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      x-authorization: Personal author self; team author only current leader.
      x-business-errors: [NOT_TEAM_LEADER, CUSTOM_TYPE_REQUIRED, MEDIA_NOT_READY, TAG_NOT_FOUND]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/OpportunityInput' } }
      responses:
        '202':
          description: Opportunity сохранено в pending moderation.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/Opportunity' } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
  /opportunities/{opportunityId}:
    parameters:
      - { $ref: '#/components/parameters/OpportunityId' }
    get:
      tags: [Opportunities]
      operationId: getOpportunity
      summary: Получить opportunity
      x-authorization: Published viewer or owning author/team leader for own non-public state.
      x-side-effects: Idempotent unique daily view fact; owners/team members excluded.
      responses:
        '200':
          description: Opportunity; absolute popularity is never returned.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/Opportunity' } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
    patch:
      tags: [Opportunities]
      operationId: updateOpportunity
      summary: Создать новую moderated opportunity version
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      x-authorization: Personal author or current team leader.
      x-business-errors: [CONTENT_EDIT_LOCKED, OPPORTUNITY_DELETING, MEDIA_NOT_READY, TAG_NOT_FOUND]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/OpportunityInput' } }
      responses:
        '202':
          description: New version pending; last approved remains public.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/Opportunity' } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
    delete:
      tags: [Opportunities]
      operationId: deleteOpportunity
      summary: Скрыть и запустить restartable deletion opportunity
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      x-authorization: Personal author or current team leader.
      x-business-errors: [DELETION_ALREADY_IRREVERSIBLE]
      responses:
        '202':
          description: Deletion workflow accepted.
          content:
            application/json: { schema: { $ref: '#/components/schemas/DeletionStatus' } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
  /me/opportunities:
    get:
      tags: [Opportunities]
      operationId: listOwnOpportunities
      summary: Получить personal и led-team opportunities для управления
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: authorKind, in: query, schema: { $ref: '#/components/schemas/AuthorKind' } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/OpportunityState' } }
      x-sorting: createdAt descending, opportunityId descending.
      responses:
        '200':
          description: Management page.
          content:
            application/json: { schema: { $ref: '#/components/schemas/OpportunityPage' } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
  /opportunities/{opportunityId}/deactivation:
    parameters:
      - { $ref: '#/components/parameters/OpportunityId' }
    post:
      tags: [Opportunities]
      operationId: deactivateOpportunity
      summary: Снять opportunity с публикации
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      x-business-errors: [STATE_CONFLICT]
      responses:
        '200':
          description: Opportunity inactive.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
