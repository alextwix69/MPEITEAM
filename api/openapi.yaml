        '5XX': { $ref: '#/components/responses/Problem5xx' }
  /moderation/appeals:
    get:
      tags: [Moderation]
      operationId: listModerationAppeals
      summary: Получить moderator appeal queue
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AppealStatus' } }
        - { name: assignedToMe, in: query, schema: { type: boolean } }
        - { name: escalated, in: query, schema: { type: boolean } }
      x-authorization: Moderator appeals.review; escalation permission for escalated action.
      x-sorting: priority descending, deadlineAt ascending, appealId ascending.
      responses:
        '200': { description: Appeal page., content: { application/json: { schema: { $ref: '#/components/schemas/AppealPage' } } } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
  /moderation/appeals/{appealId}/claim:
    parameters: [{ $ref: '#/components/parameters/AppealId' }]
    post:
      tags: [Moderation]
      operationId: claimModerationAppeal
      summary: Назначить open appeal текущему moderator
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
      x-business-errors: [ALREADY_ASSIGNED, APPEAL_ALREADY_RESOLVED]
      responses:
        '200':
          description: Claimed appeal.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Appeal' } } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
  /moderation/appeals/{appealId}/decision:
    parameters: [{ $ref: '#/components/parameters/AppealId' }]
    post:
      tags: [Moderation]
      operationId: decideModerationAppeal
      summary: Необратимо подтвердить или отменить moderation decision
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
      x-authorization: Assigned moderator with appeals.review and escalation permission when applicable.
      x-business-errors: [APPEAL_ALREADY_RESOLVED, STATE_CONFLICT]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AppealDecision' } } } }
      responses:
        '200':
          description: Terminal appeal; overturned restores last approved version.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Appeal' } } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
  /privacy-requests:
    post:
      tags: [Compliance]
      operationId: createPrivacyRequest
      summary: Запросить export/correction/restriction/account deletion
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      x-authorization: Current active account; deletion additionally requires recent re-authentication.
      x-business-errors: [OPEN_DELETION_REQUEST_EXISTS, REAUTH_REQUIRED]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PrivacyRequestCreate' } } } }
      responses:
        '202':
          description: Request accepted; deletion immediately hides account and revokes other sessions.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/PrivacyRequest' } } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
    get:
      tags: [Compliance]
      operationId: listPrivacyRequests
      summary: Получить свои privacy requests
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/PrivacyRequestType' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/PrivacyRequestStatus' } }
      x-authorization: Current session including deleting account.
      x-sorting: requestedAt descending, requestId descending.
      responses:
        '200': { description: Privacy request page., content: { application/json: { schema: { $ref: '#/components/schemas/PrivacyRequestPage' } } } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
  /privacy-requests/{requestId}:
    parameters: [{ $ref: '#/components/parameters/PrivacyRequestId' }]
    get:
      tags: [Compliance]
      operationId: getPrivacyRequest
      summary: Получить свой privacy request
      x-authorization: Owner session including deleting account.
      responses:
        '200':
          description: Privacy request; no embedded export payload.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { schema: { type: string, const: no-store } }
          content: { application/json: { schema: { $ref: '#/components/schemas/PrivacyRequest' } } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
  /privacy-requests/{requestId}/cancel:
    parameters: [{ $ref: '#/components/parameters/PrivacyRequestId' }]
    post:
      tags: [Compliance]
      operationId: cancelPrivacyRequest
      summary: Отменить deletion request до irreversibleAt
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
      x-authorization: Owner session in deleting account state.
      x-business-errors: [DELETION_ALREADY_IRREVERSIBLE, REQUEST_NOT_CANCELLABLE]
      responses:
        '200':
          description: Deletion cancelled and account restored to active.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/PrivacyRequest' } } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
  /privacy-requests/{requestId}/result-url:
    parameters: [{ $ref: '#/components/parameters/PrivacyRequestId' }]
    get:
      tags: [Compliance]
      operationId: getPrivacyRequestResultUrl
      summary: Получить one-time URL готовой data export
      x-authorization: Owner session; completed export request only.
      x-business-errors: [PRIVACY_RESULT_NOT_READY, PRIVACY_RESULT_EXPIRED]
      responses:
        '200':
          description: One-time URL with TTL no longer than five minutes.
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/DownloadUrl' } } }
        '4XX': { $ref: '#/components/responses/Problem4xx' }
        '5XX': { $ref: '#/components/responses/Problem5xx' }
components:
  securitySchemes:
    CookieSession:
      type: apiKey
      in: cookie
      name: __Host-session
      description: Opaque, Secure, HttpOnly, SameSite=Lax session cookie.
  headers:
    ETag:
      description: Quoted decimal rowVersion used by If-Match.
      schema: { type: string, pattern: '^"[0-9]+"$' }
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Session-bound CSRF token; Origin must also be allowlisted.
      schema: { type: string, minLength: 32, maxLength: 256 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Scoped to account, method and normalized route; retained at least 24h.
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[\x21-\x7E]+$' }
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[\x21-\x7E]+$' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag полученного resource; missing=428, stale=412.
      schema: { type: string, pattern: '^"[0-9]+"$' }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque signed cursor bound to route, filters and sort.
      schema: { type: string, minLength: 1, maxLength: 2048 }
    AccountId: { name: accountId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ResumeId: { name: resumeId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    UploadId: { name: uploadId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    MediaId: { name: mediaId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    OpportunityId: { name: opportunityId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ApplicationId: { name: applicationId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    TeamId: { name: teamId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    JoinRequestId: { name: requestId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    InvitationId: { name: invitationId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    EventId: { name: eventId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ConversationId: { name: conversationId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    MessageId: { name: messageId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    NotificationId: { name: notificationId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ReportId: { name: reportId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    DecisionId: { name: decisionId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    ReviewId: { name: reviewId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    AppealId: { name: appealId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    PrivacyRequestId: { name: requestId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
  responses:
    Problem4xx:
      description: Client/authentication/authorization/validation/business/concurrency error.
      headers:
        X-Request-Id: { schema: { $ref: '#/components/schemas/Uuid' } }
        Retry-After: { schema: { type: integer, minimum: 0 } }
      content:
        application/problem+json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    Problem5xx:
      description: Safe server/upstream error; retry only when error.retryable=true.
      headers:
        X-Request-Id: { schema: { $ref: '#/components/schemas/Uuid' } }
        Retry-After: { schema: { type: integer, minimum: 0 } }
      content:
        application/problem+json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }
    OperationAccepted:
      description: Request accepted without revealing account existence.
      content:
        application/json: { schema: { $ref: '#/components/schemas/OperationAccepted' } }
  schemas:
    Uuid:
      type: string
      format: uuid
      description: UUIDv7 in canonical lowercase form.
    TimeZone:
      type: string
      minLength: 1
      maxLength: 64
      default: Europe/Moscow
      examples: [Europe/Moscow]
    FormalRole: { type: string, enum: [student, teacher, employer] }
    SystemRole: { type: string, enum: [user, moderator] }
    AccountState: { type: string, enum: [unverified, active, deleting, deleted] }
    AuthorKind: { type: string, enum: [account, team] }
    PublicationState: { type: string, enum: [draft, pending, published, revision_required, hidden, deleting] }
    PageInfo:
      type: object
      additionalProperties: false
      required: [nextCursor, hasMore]
      properties:
        nextCursor: { type: [string, "null"], maxLength: 2048 }
        hasMore: { type: boolean }
    FieldError:
      type: object
      additionalProperties: false
      required: [path, code, message]
      properties:
        path: { type: string, maxLength: 256 }
        code: { type: string, pattern: '^[A-Z0-9_]+$', maxLength: 80 }
        message: { type: string, maxLength: 500 }
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message, requestId, retryable, details, fieldErrors]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_]+$', maxLength: 100 }
        message: { type: string, minLength: 1, maxLength: 1000 }
        requestId: { $ref: '#/components/schemas/Uuid' }
        retryable: { type: boolean }
        details:
          type: object
          description: Safe documented metadata; no secrets or private content.
          additionalProperties: true
        fieldErrors:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/FieldError' }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }
    OperationAccepted:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted: { type: boolean, const: true }
    CsrfToken:
      type: object
      additionalProperties: false
      required: [csrfToken]
      properties:
        csrfToken: { type: string, minLength: 32, maxLength: 256 }
    ConsentAcceptance:
      type: object
      additionalProperties: false
      required: [documentType, documentVersion, accepted]
      properties:
        documentType: { type: string, enum: [age_18, user_terms, personal_data, public_profile_distribution] }
        documentVersion: { type: string, minLength: 1, maxLength: 64 }
        accepted: { type: boolean, const: true }
    RegistrationRequest:
      type: object
      additionalProperties: false
      required: [email, password, formalRole, profile, consents]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, format: password, minLength: 12, maxLength: 128, writeOnly: true }
        formalRole: { $ref: '#/components/schemas/FormalRole' }
        profile: { $ref: '#/components/schemas/ProfileInput' }
        consents:
          type: array
          minItems: 4
          maxItems: 4
          items: { $ref: '#/components/schemas/ConsentAcceptance' }
    RegistrationResult:
      type: object
      additionalProperties: false
      required: [accountId, accountState, verificationEmailQueued]
      properties:
        accountId: { $ref: '#/components/schemas/Uuid' }
        accountState: { type: string, const: unverified }
        verificationEmailQueued: { type: boolean }
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 32, maxLength: 2048, writeOnly: true }
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 320 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, format: password, minLength: 1, maxLength: 128, writeOnly: true }
    PasswordResetConfirm:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: { type: string, minLength: 32, maxLength: 2048, writeOnly: true }
        password: { type: string, format: password, minLength: 12, maxLength: 128, writeOnly: true }
    SessionView:
      type: object
      additionalProperties: false
      required: [accountId, accountState, expiresAt]
      properties:
        accountId: { $ref: '#/components/schemas/Uuid' }
        accountState: { $ref: '#/components/schemas/AccountState' }
        expiresAt: { type: string, format: date-time }
    CurrentAccount:
      type: object
      additionalProperties: false
      required: [id, formalRole, systemRole, state, emailVerified, capabilities, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        formalRole: { $ref: '#/components/schemas/FormalRole' }
        systemRole: { $ref: '#/components/schemas/SystemRole' }
        state: { $ref: '#/components/schemas/AccountState' }
        emailVerified: { type: boolean }
        capabilities:
          type: array
          uniqueItems: true
          items: { type: string, maxLength: 100 }
        deletionIrreversibleAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    ProfileInput:
      type: object
      additionalProperties: false
      required: [fullName, specialization, timezone]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 200 }
        specialization: { type: string, minLength: 1, maxLength: 200 }
        timezone: { $ref: '#/components/schemas/TimeZone' }
        institute: { type: string, minLength: 1, maxLength: 200 }
        course: { type: integer, minimum: 1, maximum: 6 }
        department: { type: string, minLength: 1, maxLength: 200 }
        company: { type: string, minLength: 1, maxLength: 200 }
        position: { type: string, minLength: 1, maxLength: 200 }
        avatarMediaId: { $ref: '#/components/schemas/Uuid' }
      description: Role-specific requirements are enforced using account formalRole.
    Profile:
      type: object
      additionalProperties: false
      required: [id, accountId, formalRole, publicationState, editLocked, rowVersion, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        accountId: { $ref: '#/components/schemas/Uuid' }
        formalRole: { $ref: '#/components/schemas/FormalRole' }
        publicationState: { $ref: '#/components/schemas/PublicationState' }
        published: { $ref: '#/components/schemas/ProfileInput' }
        pending: { $ref: '#/components/schemas/ProfileInput' }
        editLocked: { type: boolean }
        moderation: { $ref: '#/components/schemas/ModerationStatus' }
        rowVersion: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PublicProfile:
      type: object
      additionalProperties: false
      required: [accountId, formalRole, profile, resumes]
      properties:
        accountId: { $ref: '#/components/schemas/Uuid' }
        formalRole: { $ref: '#/components/schemas/FormalRole' }
        profile: { $ref: '#/components/schemas/ProfileInput' }
        resumes:
          type: array
          maxItems: 6
          items: { $ref: '#/components/schemas/PublicResume' }
    Project:
      type: object
      additionalProperties: false
      required: [title, description]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        url: { type: string, format: uri, maxLength: 2048 }
    ResumeInput:
      type: object
      additionalProperties: false
      required: [about, projects, tagIds, searchVisible]
      properties:
        about: { type: string, maxLength: 1024 }
        projects: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/Project' } }
        tagIds: { type: array, maxItems: 20, uniqueItems: true, items: { $ref: '#/components/schemas/Uuid' } }
        searchVisible: { type: boolean }
        imageMediaId: { $ref: '#/components/schemas/Uuid' }
    PublicResume:
      type: object
      additionalProperties: false
      required: [id, slot, about, projects, tagIds]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        slot: { type: integer, minimum: 0, maximum: 5 }
        about: { type: string, maxLength: 1024 }
        projects: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/Project' } }
        tagIds: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/Uuid' } }
        imageMediaId: { $ref: '#/components/schemas/Uuid' }
    Resume:
      type: object
      additionalProperties: false
      required: [id, slot, primary, searchVisible, publicationState, editLocked, rowVersion, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        slot: { type: integer, minimum: 0, maximum: 5 }
        primary: { type: boolean }
        searchVisible: { type: boolean }
        publicationState: { $ref: '#/components/schemas/PublicationState' }
        published: { $ref: '#/components/schemas/ResumeInput' }
        pending: { $ref: '#/components/schemas/ResumeInput' }
        editLocked: { type: boolean }
        moderation: { $ref: '#/components/schemas/ModerationStatus' }
        rowVersion: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ResumeList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, maxItems: 6, items: { $ref: '#/components/schemas/Resume' } }
    ModerationStatus:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { type: string, enum: [not_submitted, pending, approved, revision_required, failed, manual_review_pending, appeal_pending] }
        decisionId: { $ref: '#/components/schemas/Uuid' }
        deadlineAt: { type: string, format: date-time }
        violationCodes: { type: array, uniqueItems: true, items: { type: string, maxLength: 100 } }
        reason: { type: string, maxLength: 2000 }
    Tag:
      type: object
      additionalProperties: false
      required: [id, code, name, category, sortOrder]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, maxLength: 80 }
        name: { type: string, maxLength: 120 }
        category: { type: string, maxLength: 120 }
        sortOrder: { type: integer, minimum: 0, maximum: 32767 }
    TagCatalog:
      type: object
      additionalProperties: false
      required: [version, items]
      properties:
        version: { type: string, maxLength: 32 }
        items: { type: array, minItems: 180, maxItems: 180, items: { $ref: '#/components/schemas/Tag' } }
    PersonSearchItem:
      type: object
      additionalProperties: false
      required: [accountId, fullName, formalRole, tagIds]
      properties:
        accountId: { $ref: '#/components/schemas/Uuid' }
        fullName: { type: string, maxLength: 200 }
        formalRole: { $ref: '#/components/schemas/FormalRole' }
        specialization: { type: string, maxLength: 200 }
        institute: { type: string, maxLength: 200 }
        department: { type: string, maxLength: 200 }
        company: { type: string, maxLength: 200 }
        avatarMediaId: { $ref: '#/components/schemas/Uuid' }
        tagIds: { type: array, maxItems: 180, items: { $ref: '#/components/schemas/Uuid' } }
    PeopleSearchPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PersonSearchItem' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    UploadCreate:
      type: object
      additionalProperties: false
      required: [contentScope, ownerType, ownerId, mimeType, sizeBytes]
      properties:
        contentScope: { type: string, enum: [private_message, public_content] }
        ownerType: { type: string, enum: [profile, resume, team, opportunity, event, message_draft] }
        ownerId: { $ref: '#/components/schemas/Uuid' }
        mimeType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        sizeBytes: { type: integer, minimum: 1, maximum: 5242880 }
    UploadSession:
      type: object
      additionalProperties: false
      required: [id, contentScope, state, expiresAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        contentScope: { type: string, enum: [private_message, public_content] }
        state: { type: string, enum: [created, processing, ready, moderation_pending, approved, rejected, failed, expired, consumed] }
        uploadUrl: { type: string, format: uri, maxLength: 4096 }
        uploadHeaders: { type: object, additionalProperties: { type: string } }
        mediaId: { $ref: '#/components/schemas/Uuid' }
        expiresAt: { type: string, format: date-time }
        failureCode: { type: string, maxLength: 100 }
    DownloadUrl:
      type: object
      additionalProperties: false
      required: [url, expiresAt]
      properties:
        url: { type: string, format: uri, maxLength: 4096 }
        expiresAt: { type: string, format: date-time }
    OpportunityType:
