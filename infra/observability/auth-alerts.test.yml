rule_files:
  - auth-alerts.yml
evaluation_interval: 1m
tests:
  - name: auth failures respect minimum traffic and recover
    interval: 1m
    input_series:
      - series: 'identity_auth_commands_total{service="test",operation="login",result="failed"}'
        values: '0+2x10 20+0x15'
      - series: 'identity_auth_commands_total{service="test",operation="login",result="completed"}'
        values: '0+18x10 180+20x15'
      - series: 'identity_auth_commands_total{service="test",operation="reset_confirm",result="failed"}'
        values: '0+0.1x26'
      - series: 'identity_csrf_failures_total{service="test"}'
        values: '0+10x10 100+0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: AuthCommandFailures
        exp_alerts:
          - exp_labels: { service: test, operation: login, severity: warning }
            exp_annotations:
              summary: 'Повышенная доля ошибок входа или восстановления доступа.'
              runbook: docs/production/runbook.md
      - eval_time: 25m
        alertname: AuthCommandFailures
        exp_alerts: []
      - eval_time: 10m
        alertname: AuthCsrfFailures
        exp_alerts:
          - exp_labels: { service: test, severity: warning }
            exp_annotations:
              summary: 'Повышенное число отказов Origin/CSRF.'
              runbook: docs/production/runbook.md
      - eval_time: 25m
        alertname: AuthCsrfFailures
        exp_alerts: []
  - name: delayed delivery and DLQ clear after recovery
    interval: 1m
    input_series:
      - series: 'outbox_delivery_oldest_pending_age{service="test",consumer="identity.password-reset-email"}'
        values: '300000 360000 1800000 1860000 0'
      - series: 'outbox_delivery_backlog{service="test",consumer="identity.password-reset-email",state="dead_letter"}'
        values: '0 1 1 1 0'
    alert_rule_test:
      - eval_time: 0m
        alertname: PasswordResetDelayed
        exp_alerts: []
      - eval_time: 1m
        alertname: PasswordResetDelayed
        exp_alerts:
          - exp_labels: { service: test, severity: warning }
            exp_annotations:
              summary: 'Письмо восстановления ожидает доставки более 5 минут.'
              runbook: docs/production/runbook.md
      - eval_time: 1m
        alertname: PasswordResetDeadLetter
        exp_alerts:
          - exp_labels: { service: test, severity: warning }
            exp_annotations:
              summary: 'Письмо восстановления доступа находится в DLQ.'
              runbook: docs/production/runbook.md
      - eval_time: 2m
        alertname: PasswordResetDeliveryCritical
        exp_alerts: []
      - eval_time: 3m
        alertname: PasswordResetDeliveryCritical
        exp_alerts:
          - exp_labels: { service: test, severity: critical }
            exp_annotations:
              summary: 'Письмо восстановления ожидает доставки более 30 минут.'
              runbook: docs/production/runbook.md
      - eval_time: 4m
        alertname: PasswordResetDelayed
        exp_alerts: []
      - eval_time: 4m
        alertname: PasswordResetDeadLetter
        exp_alerts: []
      - eval_time: 4m
        alertname: PasswordResetDeliveryCritical
        exp_alerts: []
  - name: missing scrape becomes visible and recovers
    interval: 1m
    input_series:
      - series: 'up{job="komanda-api",instance="api:9464"}'
        values: '0 0 0 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: AuthMetricsUnavailable
        exp_alerts: []
      - eval_time: 2m
        alertname: AuthMetricsUnavailable
        exp_alerts:
          - exp_labels: { job: komanda-api, instance: 'api:9464', severity: warning }
            exp_annotations:
              summary: 'Недоступен endpoint метрик API или worker.'
              runbook: docs/production/runbook.md
      - eval_time: 3m
        alertname: AuthMetricsUnavailable
        exp_alerts: []
