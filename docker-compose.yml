name: komanda-mpei

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: komanda
      POSTGRES_PASSWORD: komanda
      POSTGRES_USER: komanda
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-test-database.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U komanda -d komanda']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.2.1-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: komanda-local
      MINIO_ROOT_PASSWORD: komanda-local-secret
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-setup:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 komanda-local komanda-local-secret
        mc mb --ignore-existing local/komanda-media
    restart: 'no'

  migrate:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command:
      [
        'node',
        'backend/node_modules/prisma/build/index.js',
        'migrate',
        'deploy',
        '--schema',
        'backend/prisma/schema.prisma',
      ]
    environment:
      DATABASE_URL: postgresql://komanda:komanda@postgres:5432/komanda?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command: ['node', 'backend/dist/api/main.js']
    environment: &runtime-environment
      NODE_ENV: production
      LOG_LEVEL: info
      API_PORT: 3001
      API_DATABASE_URL: postgresql://komanda:komanda@postgres:5432/komanda?schema=public&connection_limit=5&pool_timeout=5
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ru-central-1
      S3_BUCKET: komanda-media
      S3_ACCESS_KEY: komanda-local
      S3_SECRET_KEY: komanda-local-secret
      S3_FORCE_PATH_STYLE: 'true'
      DEPENDENCY_TIMEOUT_MS: 1500
      WORKER_HEARTBEAT_KEY: platform:worker:heartbeat
      WORKER_HEARTBEAT_INTERVAL_MS: 5000
      WORKER_HEARTBEAT_TTL_SECONDS: 15
      OTEL_SERVICE_NAME: komanda-mpei
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command: ['node', 'backend/dist/worker/main.js']
    environment:
      <<: *runtime-environment
      WORKER_DATABASE_URL: postgresql://komanda:komanda@postgres:5432/komanda?schema=public&connection_limit=3&pool_timeout=5
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  proxy:
    image: nginx:1.29.1-alpine
    ports:
      - '8080:8080'
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
